# Install to: ~/.config/xdg-desktop-portal/hyprland-portals.conf
#
# Keeps Hyprland's own backend for screencast/screenshot/global-shortcuts and
# routes ONLY RemoteDesktop to the bridge. The user file overrides
# /usr/share/xdg-desktop-portal/hyprland-portals.conf. Adjust `default=` to
# match your system's effective config if it differs.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.RemoteDesktop=hypr-kdeconnect
