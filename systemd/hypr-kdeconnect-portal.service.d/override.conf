# Drop-in for hypr-kdeconnect-portal.service (the RemoteDesktop portal bridge).
#
# WHY THIS EXISTS:
# The bridge authorizes the caller (e.g. Deskflow) by reading /proc/<pid>/exe.
# Its default hardening (PrivateTmp/ProtectSystem/ProtectHome) puts this *user*
# service in a private USER namespace, from which it cannot read another
# process's /proc/<pid>/exe (cross-user-namespace denial). The bridge then
# refuses every session with: "refusing RemoteDesktop session for app id ''".
#
# Disabling that isolation lets the bridge verify the caller. The bridge still
# only authorizes specific executables (deskflow-core / kdeconnectd).
#
# Install to: ~/.config/systemd/user/hypr-kdeconnect-portal.service.d/override.conf
# then: systemctl --user daemon-reload && systemctl --user restart hypr-kdeconnect-portal
[Service]
PrivateTmp=no
ProtectSystem=no
ProtectHome=no
